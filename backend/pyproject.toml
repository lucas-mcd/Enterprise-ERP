[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "enterprise-erp"
version = "0.8.0"
requires-python = ">=3.12"
dependencies = [
 "openpyxl>=3.1,<4", "reportlab>=4.2,<5",
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1",
 "sqlalchemy[asyncio]>=2.0.36,<2.1", "asyncpg>=0.30,<1",
 "alembic>=1.14,<2", "pydantic-settings>=2.6,<3", "PyJWT>=2.10,<3",
 "celery[redis]>=5.4,<6", "redis>=5,<6", "argon2-cffi>=23.1,<26", "email-validator>=2.2,<3"
]
[project.optional-dependencies]
dev = ["types-openpyxl", "types-reportlab", "pytest>=8,<10", "pytest-asyncio>=0.24,<2", "aiosqlite>=0.20,<1", "httpx>=0.28,<1", "black>=24,<27", "flake8>=7,<8", "mypy>=1.13,<2", "fakeredis[lua]>=2.26,<3"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.black]
line-length = 88
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
