x-backend: &backend
  build: ./backend
  image: enterprise-erp-backend:local
  init: true
  environment: &environment
    DATABASE_URL: postgresql+asyncpg://erp:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/erp
    REDIS_URL: redis://redis:6379/0
    BROKER_URL: redis://redis:6379/1
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    REFRESH_TOKEN_SECONDS: ${REFRESH_TOKEN_SECONDS:-604800}
    REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    ACCESS_TOKEN_SECONDS: ${ACCESS_TOKEN_SECONDS:-900}
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  networks: [internal]
  depends_on:
    migrate: {condition: service_completed_successfully}
    redis: {condition: service_healthy}
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: erp
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U erp -d erp']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [internal]
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [internal]
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    restart: 'no'
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *backend
    volumes: [report_data:/home/erp/reports:ro]
    ports: ['127.0.0.1:8000:8000']
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health/ready", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *backend
    volumes: [report_data:/home/erp/reports]
    command: [celery, -A, erp.workers.celery_app:app, worker, --loglevel=INFO, --concurrency=2]
    stop_grace_period: 310s
  beat:
    <<: *backend
    command: [celery, -A, erp.workers.celery_app:app, beat, --loglevel=INFO, --schedule=/home/erp/beat/celerybeat-schedule]
    volumes: [beat_data:/home/erp/beat, report_data:/home/erp/reports]
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    networks: [internal]
volumes:
  postgres_data:
  redis_data:
  beat_data:
  report_data:
networks:
  internal:
